name: Publish facts-schema

# Publishes @starloghq/facts-schema to npm via Trusted Publishing (OIDC) when a
# facts-schema-v* tag is pushed (independent of the starloghq app's v* tags).
# No stored token — GitHub OIDC authenticates to npm; provenance is automatic
# (publishConfig.provenance=true).
#
# One-time setup (owner task), in this order:
#   1. The @starloghq scope must exist on npm (create the org/scope; it is
#      separate from the unscoped `starloghq` package).
#   2. BOOTSTRAP the first publish with a token (trusted publishing can't be
#      configured on a package that doesn't exist yet): create a short-lived
#      granular npm token scoped to @starloghq with publish rights, add it as the
#      repo secret `NPM_TOKEN`, then push the `facts-schema-v0.1.0` tag. This run
#      publishes 0.1.0 WITH provenance (token = registry auth; id-token:write +
#      publishConfig.provenance still generate the attestation).
#   3. After that first publish: npmjs.com → @starloghq/facts-schema → Settings →
#      Trusted Publisher: Org/user `starloghq`, Repo `index`,
#      Workflow `publish-facts-schema.yml`. THEN DELETE the `NPM_TOKEN` secret —
#      with it gone, NODE_AUTH_TOKEN renders empty and every later tag publishes
#      via OIDC (no stored token).

on:
  push:
    tags: ['facts-schema-v*']

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/facts-schema
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x # >= 22.14 required for trusted publishing
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Ensure npm >= 11.5.1 (trusted publishing)
        run: npm install -g npm@latest

      - name: Install + build (the package is zero-config tsc)
        run: |
          npm ci --workspaces --include-workspace-root
          npm run build -w @starloghq/facts-schema
        working-directory: ${{ github.workspace }}

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#facts-schema-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG_VERSION" ] || { echo "::error::tag ${GITHUB_REF_NAME} != version ${PKG_VERSION}"; exit 1; }

      - name: Publish to npm (token bootstrap → OIDC, always with provenance)
        # NODE_AUTH_TOKEN selects the auth method automatically:
        #   • BOOTSTRAP (first publish): NPM_TOKEN secret is set → token registry auth.
        #   • STEADY STATE: NPM_TOKEN deleted → renders empty → npm uses OIDC trusted
        #     publishing (configured on npmjs.com after the first publish).
        # Provenance is generated in BOTH modes (publishConfig.provenance=true + id-token:write).
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
